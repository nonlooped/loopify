name: loopify

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./infra/application.yml:/opt/Lavalink/application.yml:ro
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_SERVER_PASSWORD:?Set LAVALINK_SERVER_PASSWORD in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- --header="Authorization: $$LAVALINK_SERVER_PASSWORD" http://127.0.0.1:2333/v4/info >/dev/null || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      CLIENT_ID: ${CLIENT_ID:?Set CLIENT_ID in .env}
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_SERVER_PASSWORD:?Set LAVALINK_SERVER_PASSWORD in .env}
      BOT_LINK_TOKEN: ${BOT_LINK_TOKEN:?Set BOT_LINK_TOKEN in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET in .env}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:?Set DISCORD_OAUTH_REDIRECT_URI in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    ports:
      - "4000:4000"
    depends_on:
      lavalink:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      CLIENT_ID: ${CLIENT_ID:?Set CLIENT_ID in .env}
      GUILD_ID: ${GUILD_ID:-}
      MUSIC_SERVER_URL: http://server:4000
      BOT_LINK_TOKEN: ${BOT_LINK_TOKEN:?Set BOT_LINK_TOKEN in .env}
    depends_on:
      server:
        condition: service_healthy

name: loopify

services:
  # Named volumes are root-owned by default; Lavalink runs as UID 322 and must write plugin JARs here.
  lavalink-plugins-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /opt/Lavalink/plugins && chown -R 322:322 /opt/Lavalink/plugins",
      ]
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: unless-stopped
    depends_on:
      lavalink-plugins-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    environment:
      SERVER_PORT: "2333"
      SERVER_ADDRESS: ${SERVER_ADDRESS:-0.0.0.0}
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_SERVER_PASSWORD:?Set LAVALINK_SERVER_PASSWORD in .env}
    ports:
      - "${LAVA_PUBLISH_PORT:-2333}:2333"
    networks:
      - loopify
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- --header="Authorization: $$LAVALINK_SERVER_PASSWORD" http://127.0.0.1:2333/v4/info >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in a project .env file}
      CLIENT_ID: ${CLIENT_ID:?Set CLIENT_ID in a project .env file}
      # Only used when NODE_ENV is not production (guild command sync).
      GUILD_ID: ${GUILD_ID:-}
      # For future Lavalink client wiring (same password as Lavalink)
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_SERVER_PASSWORD:?Set LAVALINK_SERVER_PASSWORD in .env}
    depends_on:
      lavalink:
        condition: service_healthy
    networks:
      - loopify
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bot-ready"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PUBLISH_PORT:-8080}:80"
    depends_on:
      bot:
        condition: service_healthy
    networks:
      - loopify
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  loopify:
    driver: bridge

volumes:
  lavalink-plugins:

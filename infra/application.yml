server:
  port: ${SERVER_PORT:2333}
  address: ${SERVER_ADDRESS:0.0.0.0}
  http2:
    enabled: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - MUSIC
      - WEB
      - M_WEB
      - ANDROID_VR
      - TV
      - TVHTML5_SIMPLY

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.0"
      snapshot: false

  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    # Lower = snappier, but too low can cause crackling/stutter.
    nonAllocatingFrameBuffer: false
    bufferDurationMs: 120
    # frameBufferDurationMs controls how much encoded audio is pre-buffered.
    # 400ms keeps audible pause/skip close to the UI click at the cost of
    # slightly higher stutter risk on constrained CPUs or flaky networks.
    frameBufferDurationMs: 400

    # Lower CPU cost helps responsiveness under load.
    opusEncodingQuality: 5
    resamplingQuality: LOW

    # Faster stuck detection + better controller responsiveness
    trackStuckThresholdMs: 8000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 1

    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: false
    gc-warnings: true

    timeouts:
      connectTimeoutMs: 3000
      connectionRequestTimeoutMs: 3000
      socketTimeoutMs: 3000

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/

  level:
    root: INFO
    lavalink: INFO

  request:
    enabled: false

  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
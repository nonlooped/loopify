name: Verify Packaging

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "electron.vite.config.ts"
      - "src/main/**"
      - "resources/binaries/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare binaries
        run: pnpm run prepare:binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify Drizzle migrations layout
        run: pnpm run db:verify

      - name: Build
        run: pnpm run build

      - name: Verify bundled mpv binary exists
        run: pnpm run verify:mpv

      - name: Verify electron-builder config
        run: pnpm exec electron-builder --win dir --publish never
